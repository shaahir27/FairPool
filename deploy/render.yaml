services:
  # Render deployment reference: one free API web service serving the built SPA from
  # the same origin. The live database is Supabase, supplied through DATABASE_URL;
  # this file provisions no Render Postgres. A separate static site would put the page
  # on another site than the API, and a *.onrender.com cross-site cookie is dropped
  # (DEP: the page and the API share one origin). Free web services sleep after 15
  # minutes and there is no free background worker. Restore the worker and paid
  # instances before 2026-11-20 (BD-05).
  - type: web
    name: fairpool-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./deploy/Dockerfile.api
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - fromGroup: common
      - fromGroup: paypal
      - fromGroup: ai
      - fromGroup: search
      # Render terminates TLS at its edge, so the only trusted X-Forwarded-* source is
      # Render's own proxy: trust every peer on the private network, and nothing else
      # can reach the container's socket.
      - key: FORWARDED_ALLOW_IPS
        value: "*"
      # Supabase session-pooler URL (external database); no Render Postgres.
      - key: DATABASE_URL
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: FRONTEND_BASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: HMAC_KEY
        sync: false
      - key: RECEIPT_SIGNING_KEY
        sync: false
      - key: ADDRESS_ENCRYPTION_KEY
        sync: false
      - key: VAULT_TOKEN_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: SINGLE_SELLER_EMAIL
        sync: false
      - key: SINGLE_SELLER_MERCHANT_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ELASTICSEARCH_URL
        sync: false
      - key: ELASTICSEARCH_API_KEY
        sync: false

envVarGroups:
  - name: common
    envVars:
      - key: APP_ENV
        value: render
      - key: LOG_LEVEL
        value: INFO
      - key: PAYMENT_ROUTER
        value: single_seller
      # The demo ships the path the README describes: each buyer approves one AUTHORIZE
      # order for the exact final amount, which is what live evidence IT-5, C-08 and C-09
      # actually exercised. The code default stays vault_charge (config.py), whose real
      # permission save is unshipped (DEP-5), so a live buyer there rejects VAULT_MISSING.
      # payment_mode is stamped per lot at award and never changes, so existing hosted
      # lots keep their old stamp until `make demo-reset && make demo-seed` re-creates them.
      - key: PAYMENT_MODE
        value: authorize_capture
      # States the DEP-5 limit in the blueprint instead of relying on the code default.
      - key: VAULT_REAL_SAVE_ENABLED
        value: "false"
      - key: BID_PRICING_MODE
        value: flat_delivered
      - key: PAYPAL_PAYLOAD_LEVEL
        value: "0"
      - key: TIMING_PROFILE
        value: demo
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: WEBHOOKS_ENABLED
        value: "false"
      - key: BEACON_MODE
        value: demo

  - name: paypal
    envVars:
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_API_BASE
        value: https://api-m.sandbox.paypal.com
      - key: PAYPAL_CHECKOUT_BASE
        value: https://www.sandbox.paypal.com
      - key: PAYPAL_APPROVAL_UI
        value: sdk_popup
      - key: PAYPAL_SDK_AUTH
        value: client_id
      - key: ALLOWED_PAYER_COUNTRIES
        value: US
      - key: PLATFORM_FEE_ENABLED
        value: "false"

  - name: ai
    envVars:
      # AI_ENABLED stays false until GEMINI_API_KEY is present in this group: config.py
      # refuses to start when AI_ENABLED=true and the key is missing, which would take
      # down the whole public URL the judges use. The live group also drifted from this
      # blueprint - it currently names Claude models, while adapters/ai implements
      # google-genai only. Fix the model names here and in the group together.
      - key: AI_ENABLED
        value: "false"
      - key: AI_MODEL_PARSE
        value: gemini-3.5-flash-lite
      - key: AI_MODEL_SIM
        value: gemini-3.5-flash-lite

  - name: search
    envVars:
      - key: SEARCH_BACKEND
        value: elastic
      - key: ELASTIC_INFERENCE_ID
        value: .jina-embeddings-v5-text-small
      - key: ELASTIC_INDEX_PREFIX
        value: fairpool
      - key: SIMILARITY_CHECK_ENABLED
        value: "true"
