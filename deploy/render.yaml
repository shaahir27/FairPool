services:
  # Render deployment reference: free API web service and free static site.
  # The live database is Supabase, supplied through DATABASE_URL; this file
  # provisions no Render Postgres. Free web services sleep after 15 minutes and
  # there is no free background worker. Restore the worker and paid instances
  # before 2026-11-20 (BD-05).
  - type: web
    name: fairpool-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./deploy/Dockerfile.api
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - fromGroup: common
      - fromGroup: paypal
      - fromGroup: ai
      - fromGroup: search
      # Supabase session-pooler URL (external database); no Render Postgres.
      - key: DATABASE_URL
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: FRONTEND_BASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: HMAC_KEY
        sync: false
      - key: RECEIPT_SIGNING_KEY
        sync: false
      - key: ADDRESS_ENCRYPTION_KEY
        sync: false
      - key: VAULT_TOKEN_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: SINGLE_SELLER_EMAIL
        sync: false
      - key: SINGLE_SELLER_MERCHANT_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ELASTICSEARCH_URL
        sync: false
      - key: ELASTICSEARCH_API_KEY
        sync: false
      - key: ELASTIC_INFERENCE_ID
        sync: false

  - type: web
    name: fairpool-frontend
    runtime: static
    buildCommand: "cd frontend && npm ci && npm run build"
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

envVarGroups:
  - name: common
    envVars:
      - key: APP_ENV
        value: render
      - key: LOG_LEVEL
        value: INFO
      - key: PAYMENT_ROUTER
        value: single_seller
      - key: PAYMENT_MODE
        value: vault_charge
      - key: BID_PRICING_MODE
        value: flat_delivered
      - key: PAYPAL_PAYLOAD_LEVEL
        value: "0"
      - key: TIMING_PROFILE
        value: demo
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: WEBHOOKS_ENABLED
        value: "false"
      - key: BEACON_MODE
        value: demo

  - name: paypal
    envVars:
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_API_BASE
        value: https://api-m.sandbox.paypal.com
      - key: PAYPAL_CHECKOUT_BASE
        value: https://www.sandbox.paypal.com
      - key: PAYPAL_APPROVAL_UI
        value: sdk_popup
      - key: PAYPAL_SDK_AUTH
        value: client_id
      - key: ALLOWED_PAYER_COUNTRIES
        value: US
      - key: PLATFORM_FEE_ENABLED
        value: "false"

  - name: ai
    envVars:
      - key: AI_ENABLED
        value: "false"
      - key: AI_MODEL_PARSE
        value: gemini-3.5-flash-lite
      - key: AI_MODEL_SIM
        value: gemini-3.5-flash-lite

  - name: search
    envVars:
      - key: SEARCH_BACKEND
        value: postgres
      - key: ELASTIC_INDEX_PREFIX
        value: fairpool
      - key: SIMILARITY_CHECK_ENABLED
        value: "true"
