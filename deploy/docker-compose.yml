services:
  db:
    image: postgres:16
    profiles: [test-db]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - fairpool-db:/var/lib/postgresql/data
      - ./db-init.sql:/docker-entrypoint-initdb.d/10-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    # Compose already has its own worker; only Render shares the API container.
    command: ["sh", "-c", "exec uvicorn fairpool.main:app --host 0.0.0.0 --port 8000 --no-access-log --forwarded-allow-ips $${FORWARDED_ALLOW_IPS:-127.0.0.1}"]
    env_file:
      - ../.env
    environment:
      # The image defaults to Render's port; compose pins the one it maps.
      PORT: 8000
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.worker
    env_file:
      - ../.env

  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    ports:
      - "5173:80"

  elastic:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    profiles:
      - elastic
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - fairpool-elastic:/usr/share/elasticsearch/data

volumes:
  fairpool-db:
  fairpool-elastic:
