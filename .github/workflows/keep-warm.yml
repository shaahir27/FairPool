name: Keep warm

# Render spins a free web service down after 15 minutes with no inbound traffic and
# needs about a minute to wake (https://render.com/docs/free), so a 10-minute ping
# leaves a 5-minute margin. /ready runs the database and migration checks too, which
# also keeps the free Supabase project away from its pause-after-7-days rule.
#
# The window is 20 hours a day, not 24. A free web service consumes instance hours
# while it is running and the workspace pool is 750 hours a month: 24/7 would be
# 720-744 hours, which leaves as little as 6 hours of margin before Render suspends
# every free service until the next month. 3-22 UTC is about 600 hours a month.
#
# This workflow only matters once the repository is public, which is also when
# scheduled jobs stop costing Actions minutes. While the repository is private a
# scheduled job bills at least one minute per run, so keep it disabled until the
# T10A02/T11X01 flip and then run: gh workflow enable keep-warm.yml
#
# The manual trigger below is how the app is pre-warmed before a screen share at any
# hour, including inside the four unwarmed ones.

"on":
  schedule:
    - cron: "*/10 3-22 * * *"
  workflow_dispatch:
    inputs:
      reason:
        description: Why this manual wake run was started
        required: false
        default: Waking the hosted app before a demo

permissions: {}

concurrency:
  group: keep-warm
  cancel-in-progress: false

jobs:
  ping:
    name: Wake the hosted app
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      BASE_URL: https://fairpool-api.onrender.com
    steps:
      - name: Request health and readiness
        run: |
          set -eu
          for path in /health /ready; do
            started=$SECONDS
            code=$(curl --silent --show-error --output /dev/null \
              --max-time 90 --retry 2 --retry-delay 5 \
              --write-out '%{http_code}' "${BASE_URL}${path}")
            echo "${path} -> HTTP ${code} after $((SECONDS - started))s"
            [ "${code}" = "200" ] || exit 1
          done
