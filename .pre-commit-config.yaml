repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.10
    hooks:
      - id: ruff
        args: [--fix]
        # Generated SDK code is never edited by hand or by formatters (AGENTS.md rule 26).
        exclude: ^sdk/
      - id: ruff-format
        exclude: ^sdk/
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
